<!doctype html>
<html lang="en">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>OpenCode Brave Bridge</title>
<link rel="stylesheet" href="popup.css">
<main>
  <h1>OpenCode Bridge</h1>
  <p id="connection" role="status"></p>
  <p>Select the exact OpenCode session to manage.</p>
  <label for="sessions">Session</label>
  <select id="sessions" size="6" aria-label="Pending and approved sessions"></select>
  <section id="details" hidden><strong>Selected session</strong><p id="project"></p><p id="session"></p></section>
  <p>Highlight one or more tabs in the same window with Cmd/Ctrl-click. Access is limited to their approved origins.</p>
  <button id="preview" disabled>Preview highlighted tabs</button>
  <section id="previewDetails" hidden><strong>Authorization preview</strong><ul id="tabPreview"></ul><p id="origins"></p></section>
  <button id="grant" disabled>Confirm and authorize</button>
  <button id="revoke" disabled>Revoke selected session</button>
  <p id="status" role="status" aria-live="polite"></p>
</main>
<script src="popup.js"></script>
</html>
